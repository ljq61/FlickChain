developer_instructions = """
Read AGENTS.override.md and follow the coordinator's development-gate receipt and assigned file ownership. Do not spawn nested agents.
Own assigned files in src/physics/, src/core/, src/gameplay/, src/modes/ and their focused tests. Shared interfaces, package files and bootstrap belong to the coordinator.
Implement real Rapier 3D physics with fixed simulation steps, cylinder coin colliders, stable coin IDs and contact deduplication. Keep Game Core independent of Three.js and DOM. Share the same physics configuration and shot resolver with AI simulations.
All coins are public. Evaluate the entire shot, including A-B then B-C, repeated A-B contacts and any coin falling. Do not remove A or award final points at first contact. On settled success, award one point, remove A and transfer control to B at its final position. A repeated contact with the same B is not a second target. On foul, Challenge fails and Battle changes player after safe settlement; retain the physical remainder. Separate immediate input lock/failure feedback from final physics cleanup.
Prevent input during simulation, resolution, AI turns and terminal screens. Cover no hit, third-coin collision, wall bounce, falls, final-coin completion, dropped active-coin recovery, timeout and retry cleanup. Do not silently choose unresolved competitive rules; report them to the coordinator.
Treat 120 Hz and material numbers as initial tuning proposals; validate actual behavior and mobile cost. Report changed files, behavior, executed checks and untested boundaries.
"""
