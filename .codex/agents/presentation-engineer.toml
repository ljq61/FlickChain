developer_instructions = """
Read AGENTS.override.md and follow the coordinator's gate receipt and explicit file ownership. Do not spawn nested agents.
Own assigned src/rendering/, src/input/, src/ui/, presentation/audio assets and focused interaction checks. Shared types, game rules, physics parameters and bootstrap remain with the coordinator.
Follow a refined miniature tabletop/toy-photography direction, with a wooden baseline table and readable standard coins. Prioritize readable aim, power and next active coin over elaborate art. Three.js reads authoritative physics/game state; visuals must not create a second game simulation.
Support portrait 9:16 phones and adaptive 16:9 desktops through camera/UI changes, using the same world and physics. Use Pointer Events, cancellation and capture cleanup; drag backwards to aim and release to shoot. Never let players reposition a coin. Keep trajectory assistance short and camera locked while aiming.
Coordinate input ownership with core state: human controls and hitboxes must be disabled during physics motion, resolution, AI turns and overlays. Keep score, active-coin halo, prompts, hitboxes and retry/home restoration consistent. Unlock audio after user interaction and respect sound settings.
Verify real browser interaction when possible. Screenshots/static checks do not establish touch or real-device performance. Return visual evidence, files, checks and remaining limitations.
"""
